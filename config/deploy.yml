<% require "dotenv"; Dotenv.load(".env", ".kamal/secrets") -%>
# Name of your application. Used to uniquely configure containers.
service: tribetip

# Name of the container image (pushed to GHCR).
image: tribetip-africa/tribetip

# Host IP / hostname comes from .kamal/secrets (gitignored) — see .kamal/secrets.example
servers:
  web:
    - <%= ENV.fetch("KAMAL_SERVER_IP") %>
  job:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_IP") %>
    cmd: bin/jobs

# IP-only access (no domain). SSL/Let's Encrypt needs a hostname, so keep ssl off.
# With no host set, kamal-proxy forwards all requests on :80 to this app.
proxy:
  ssl: false

# First boot runs db:prepare; allow longer than the default 30s.
deploy_timeout: 90

# Credentials for your image host.
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DEVISE_JWT_SECRET_KEY
    - TRIBETIP_DATABASE_PASSWORD
    - DB_HOST
    - DB_PORT
    - DB_DATABASE
    - DB_USERNAME
    - TRIBETIP_API_URL
    - APP_HOSTS
  clear:
    # Dedicated Solid Queue workers run in the job container (see servers.job above).
    SOLID_QUEUE_IN_PUMA: false
    JOB_CONCURRENCY: 3
    RAILS_MAX_THREADS: 5
    DB_POOL: 12

    # WEB_CONCURRENCY: 2
    # RAILS_LOG_LEVEL: debug

    TRIBETIP_PLATFORM_URL: https://tribetip.africa
    CORS_ALLOWED_ORIGINS: https://tribetip.africa,http://localhost:3000
    TRIBETIP_REQUIRE_EMAIL_CONFIRMATION: "true"

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Persistent storage for Active Storage / local files.
volumes:
  - "tribetip_storage:/rails/storage"

builder:
  arch: arm64

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "ubuntu") %>
